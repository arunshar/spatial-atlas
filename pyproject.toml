[project]
name = "spatial-atlas"
version = "1.0.0"
description = "Spatial-aware research agent built on compute-grounded reasoning (CGR) for AgentX-AgentBeats Phase 2 Sprint 2. Deterministic spatial scene graphs, entropy-guided model routing, and self-healing ML pipelines for field work analysis and Kaggle competition solving."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "httpx>=0.28.1",
    "litellm>=1.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.38.0",
    "pypdf>=5.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# BLE001 flags `except Exception`. The seventeen occurrences below were each read
# individually and are deliberate boundary catches whose job is to degrade rather than
# crash: optional model loading that sets `_available = False` and carries on, per-step
# vision degradation, the refinement retry loop, and the leak-detector registry, which
# must survive a malformed third-party detector. That registry already caused an outage
# by raising inside its own except clause, fixed in 2e593f1, which argues for keeping
# those catches broad rather than narrowing them.
#
# Scoped per file rather than ignored project-wide on purpose. A blanket ignore would
# also exempt every module added later, and BLE001 turned out to be the only rule
# surfacing a real defect here: `except (json.JSONDecodeError, Exception)` in spatial.py
# and analyzer.py, which is exactly `except Exception` because JSONDecodeError subclasses
# ValueError subclasses Exception. B014 does not catch subclass redundancy. Both are now
# fixed. Keeping the rule live everywhere else preserves that signal for new code.
"src/entropy/engine.py" = ["BLE001"]
"src/executor.py" = ["BLE001"]
"src/fieldwork/detector.py" = ["BLE001"]
"src/fieldwork/perception.py" = ["BLE001"]
"src/fieldwork/spatial.py" = ["BLE001"]
"src/fieldwork/vision.py" = ["BLE001"]
"src/mlebench/analyzer.py" = ["BLE001"]
"src/mlebench/executor.py" = ["BLE001"]
"src/mlebench/handler.py" = ["BLE001"]
"src/mlebench/strategies/leaks.py" = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not e2e and not gpu' -ra"
# Bare `pytest` at the repo root used to collect sessions/fable/work, where the one-use
# warm-control bundles live. Those suites are written against draft (guarded) bytes, so once a
# bundle is armed a stray collection can run a test body that performs a real invocation and
# permanently consumes a one-shot identity. That is not hypothetical: the b73e20c5 readiness-monitor
# identity was consumed exactly this way; the Slurm job its output happened to name was unaffected.
# Pinning testpaths closes the root-invocation vector while keeping both real suites in scope.
# It is only the first of three layers. pytest applies testpaths ONLY when the invocation
# directory is the rootdir (the `invocation_dir == rootpath` gate in _pytest/config/__init__.py);
# from any other cwd it collects from the invocation directory instead and testpaths is skipped
# entirely. Layer 2 is sessions/fable/work/conftest.py, which stops recursion from any cwd, and
# layer 3 is the tracked repo-root conftest.py, which catches a file or node id named explicitly
# on the command line. A missing entry here is globbed away without error, so CI, where
# .gitignore keeps sessions/ out of the checkout, is unaffected.
testpaths = ["tests", "sessions/msi"]
markers = [
    "unit: fast hermetic unit tests (no network/GPU)",
    "integration: local-fixture integration tests",
    "smoke: wiring/import smoke tests",
    "e2e: end-to-end, requires GPU tool server + dataset",
    "gpu: requires a GPU / GPU tool server",
    "slow: long-running",
]
